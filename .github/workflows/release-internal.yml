name: Release to Play Internal Testing

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Or run it manually from the Actions tab. A manual run defaults to a dry run:
# it builds, signs and verifies the AAB but does NOT upload to Play. Use that to
# validate the pipeline end to end without burning a version code on Play.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and sign only — do not upload to Play'
        required: true
        type: boolean
        default: true

# Never run two releases at once (avoids duplicate uploads).
concurrency:
  group: release-internal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build & publish (internal)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # A manual run is a dry run unless explicitly unticked. Tag pushes always publish.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---------------------------------------------------------------------
      # Fail fast with a readable message rather than a cryptic build error
      # thirty minutes in. An unset secret expands to an empty string, which
      # would otherwise silently produce an empty keystore / config file.
      # ---------------------------------------------------------------------
      - name: Preflight — required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          APP_CONST_KT_BASE64: ${{ secrets.APP_CONST_KT_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            GOOGLE_SERVICES_JSON_BASE64 APP_CONST_KT_BASE64
          )
          if [ "${DRY_RUN}" != "true" ]; then
            required+=(PLAY_SERVICE_ACCOUNT_JSON)
          fi

          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty repository secrets: ${missing[*]}"
            echo "Set them with: gh secret set <NAME> --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
          echo "All ${#required[@]} required secrets are present."

      # ---------------------------------------------------------------------
      # versionCode is derived from the tag, not from the run number, so it is
      # deterministic: re-running a failed release produces the same code
      # instead of silently drifting upward.
      #   v1.2.3 -> 1 * 1000000 + 2 * 1000 + 3 = 1002003
      # Play caps versionCode at 2100000000, so this supports major < 2100.
      # ---------------------------------------------------------------------
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi

          if ! [[ "${VERSION_NAME}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version '${VERSION_NAME}' is not MAJOR.MINOR.PATCH."
            echo "Tags must look like v1.2.3 — pre-release suffixes are not supported."
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          if [ "${MINOR}" -gt 999 ] || [ "${PATCH}" -gt 999 ]; then
            echo "::error::MINOR and PATCH must each be <= 999 (got ${MINOR}.${PATCH})."
            exit 1
          fi

          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Releasing ${VERSION_NAME} (versionCode ${VERSION_CODE}), dry_run=${DRY_RUN}"

      # gradle/gradle-daemon-jvm.properties pins the daemon to JetBrains Runtime 21.
      # Installing a matching JDK here stops Gradle from downloading one mid-build.
      # Compilation still targets 17 via jvmToolchain(17) in app/build.gradle.kts.
      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          # Strip whitespace before decoding: depending on how a secret was set it
          # can carry a trailing CR, and GNU base64 rejects CR as invalid input.
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | tr -d '[:space:]' \
            | base64 --decode > app/google-services.json
          jq empty app/google-services.json
          pkg="$(jq -r '.client[0].client_info.android_client_info.package_name' app/google-services.json)"
          if [ "${pkg}" != "com.xs.expensetracker" ]; then
            echo "::error::google-services.json is for package '${pkg}', expected com.xs.expensetracker."
            exit 1
          fi

      # AppConst.kt is deliberately git-ignored and restored from a secret.
      # If you add or change a constant in it, re-run:
      #   gh secret set APP_CONST_KT_BASE64 --body "$(base64 -w0 <path to AppConst.kt>)"
      - name: Restore AppConst.kt
        env:
          APP_CONST_KT_BASE64: ${{ secrets.APP_CONST_KT_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          dest="app/src/main/java/com/xs/expensetracker/utils/AppConst.kt"
          mkdir -p "$(dirname "${dest}")"
          printf '%s' "${APP_CONST_KT_BASE64}" | tr -d '[:space:]' | base64 --decode > "${dest}"
          grep -q 'GOOGLE_WEB_CLIENT_ID' "${dest}" || {
            echo "::error::Restored AppConst.kt does not define GOOGLE_WEB_CLIENT_ID."
            echo "The APP_CONST_KT_BASE64 secret is stale or corrupt."
            exit 1
          }

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' \
            | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          # Credential secrets can carry a stray CR too, which would silently
          # become part of the password and fail to open the store.
          storepass="$(printf '%s' "${KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          alias="$(printf '%s' "${KEY_ALIAS}" | tr -d '\r\n')"
          # Prove the store opens and holds the expected alias before spending a
          # full build on it — a bad keystore secret otherwise fails at packaging.
          keytool -list \
            -keystore "${RUNNER_TEMP}/release.keystore" \
            -storepass "${storepass}" \
            -alias "${alias}" > /dev/null
          echo "Keystore opened; alias '${alias}' present."

      - name: Unit tests
        shell: bash
        run: ./gradlew testReleaseUnitTest

      - name: Build release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Normalise before Gradle reads them, for the same CR reason as above.
          export KEYSTORE_PASSWORD="$(printf '%s' "${KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          export KEY_ALIAS="$(printf '%s' "${KEY_ALIAS}" | tr -d '\r\n')"
          export KEY_PASSWORD="$(printf '%s' "${KEY_PASSWORD}" | tr -d '\r\n')"
          ./gradlew bundleRelease

      # ---------------------------------------------------------------------
      # Guard against shipping a bundle signed with the wrong key. Two keystores
      # with identical subject and alias exist for this project, so identity has
      # to be checked by fingerprint. Set the expected value with:
      #   gh variable set RELEASE_SIGNING_SHA256 --body "AA:BB:.."
      # ---------------------------------------------------------------------
      - name: Verify signing certificate
        env:
          EXPECTED_SHA256: ${{ vars.RELEASE_SIGNING_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          [ -f "${aab}" ] || { echo "::error::${aab} was not produced."; exit 1; }

          # Normalise to bare uppercase hex so the expected value can be given
          # with or without the colons keytool prints.
          norm() { tr -d '[:space:]:' | tr 'a-f' 'A-F'; }

          actual="$(keytool -printcert -jarfile "${aab}" \
                    | awk -F'SHA256: ' '/SHA256:/ {print $2; exit}' | norm)"
          if [ -z "${actual}" ]; then
            echo "::error::Could not read a SHA-256 fingerprint from ${aab}."
            exit 1
          fi
          echo "AAB signing SHA-256: ${actual}"

          if [ -z "${EXPECTED_SHA256:-}" ]; then
            echo "::warning::RELEASE_SIGNING_SHA256 is not set — skipping fingerprint check."
            exit 0
          fi

          expected="$(printf '%s' "${EXPECTED_SHA256}" | norm)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Signing certificate mismatch."
            echo "  expected: ${expected}"
            echo "  actual:   ${actual}"
            exit 1
          fi
          echo "Signing certificate matches the expected fingerprint."

      # Uploaded before the Play step so a failed upload still leaves something
      # to inspect and retry with. Scoped to build outputs only — never secrets.
      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.VERSION_NAME }}
          retention-days: 30
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Publish to Play Console (internal track)
        if: env.DRY_RUN != 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.xs.expensetracker
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Dry run — skipped Play upload
        if: env.DRY_RUN == 'true'
        run: |
          echo "::notice::Dry run — AAB built, signed and verified but not uploaded."

      - name: Scrub restored secrets
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/release.keystore" \
                app/google-services.json \
                app/src/main/java/com/xs/expensetracker/utils/AppConst.kt
